<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music | Wreal X</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root{
            --bg:#0A0A0A;
            --panel:#121212;
            --text:#E7E7E7;
            --muted:#BDBDBD;
            --green:#39FF14;
            --green-2:#00FF41;
        }

        .kit-overlay,
        .kit-widget,
        .kit-widget-overlay {
            z-index: 40 !important;
        }

        * { box-sizing:border-box; margin:0; padding:0; }
        html, body {
            background:var(--bg);
            color:var(--text);
            font-family:"Inter", sans-serif;
            min-height:100vh;
            overflow-x:hidden;
        }
        a, button { font-family:"Inter", sans-serif; }
        h1,h2,h3,.logo,.brand-text,.nav-toggle,.page-sub,.release-title,.release-item h3 { font-weight:800; }

        nav{
            display:flex;
            justify-content:flex-start;
            align-items:center;
            padding:1.1rem 1.2rem 0.8rem;
            width:100%;
            position:relative;
            z-index:30;
        }

        .logo{
            display:inline-flex;
            align-items:center;
            gap:0.5rem;
            margin-left:3.7rem;
            color:var(--green);
            text-decoration:none;
            text-transform:uppercase;
            letter-spacing:0.08em;
            text-shadow:0 0 35px rgba(57,255,20,0.2);
        }
        .brand-mark { font-size:1.1rem; line-height:1; }
        .brand-logo{
            width:auto; height:30px;
            border-radius:8px;
            object-fit:cover;
            display:inline-block;
            box-shadow:0 0 20px rgba(57,255,20,0.15);
        }
        .brand-text{
            display:inline-block;
            font-size:1.05rem;
            font-weight:800;
            letter-spacing:0.08em;
        }

        .nav-toggle{
            position:fixed;
            top:1.15rem;
            left:1.15rem;
            width:48px;
            height:48px;
            border:1px solid rgba(57,255,20,0.65);
            background:rgba(10,10,10,0.85);
            border-radius:12px;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            gap:6px;
            cursor:pointer;
            z-index:60;
            box-shadow:0 0 20px rgba(57,255,20,0.12);
        }
        .nav-toggle:hover{
            border-color:var(--green);
            box-shadow:0 0 30px rgba(57,255,20,0.2);
        }
        .nav-toggle span{
            display:block;
            width:22px;
            height:2px;
            background:var(--green);
            border-radius:2px;
            transition:transform 0.3s ease, opacity 0.3s ease;
        }
        .nav-toggle[aria-expanded="true"] span:nth-child(1){ transform:translateY(8px) rotate(45deg); }
        .nav-toggle[aria-expanded="true"] span:nth-child(2){ opacity:0; }
        .nav-toggle[aria-expanded="true"] span:nth-child(3){ transform:translateY(-8px) rotate(-45deg); }

        .side-nav{
            position:fixed;
            top:0; left:0;
            width:min(300px,80vw);
            height:100vh;
            background:rgba(10,10,10,0.97);
            border-right:1px solid rgba(57,255,20,0.3);
            box-shadow:0 0 40px rgba(0,0,0,0.35);
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:flex-start;
            gap:1rem;
            padding:5.5rem 1.25rem 2rem;
            transform:translateX(-105%);
            transition:transform 0.35s ease;
            z-index:55;
        }
        .side-nav.open { transform:translateX(0); }
        .side-nav a{
            width:100%;
            display:block;
            color:#fff;
            text-decoration:none;
            font-size:1.08rem;
            font-weight:700;
            letter-spacing:0.08em;
            text-transform:uppercase;
            padding:0.9rem 1rem;
            border-radius:10px;
            background:rgba(255,255,255,0.02);
            border:1px solid rgba(255,255,255,0.08);
            transition:all 0.3s ease;
        }
        .side-nav a:hover{
            color:var(--green);
            border-color:rgba(57,255,20,0.6);
            background:rgba(57,255,20,0.08);
            box-shadow:0 0 25px rgba(57,255,20,0.08);
        }

        .nav-pointer{
            position:fixed;
            top:3.8rem;
            left:4.5rem;
            font-size:2rem;
            filter:drop-shadow(0 0 12px rgba(57,255,20,0.6));
            pointer-events:none;
            z-index:70;
            animation:hand-bounce 1.1s ease-in-out infinite, hand-fade 0.6s ease 6s forwards;
        }
        @keyframes hand-bounce {
            0%,100% { transform:translateY(0) rotate(8deg); }
            50% { transform:translateY(-12px) rotate(0deg); }
        }
        @keyframes hand-fade {
            to { opacity:0; transform:translateY(-5px) scale(0.9); }
        }

        .hero-bg{
            min-height:38vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
            padding:2rem 5%;
            background:
                linear-gradient(to bottom, rgba(10,10,10,0.2) 0%, rgba(10,10,10,0.8) 50%, #0A0A0A 100%),
                url('https://iili.io/CD0qtob.png') center/cover no-repeat fixed;
            position:relative;
        }
        .hero-bg * { position:relative; z-index:1; }
        .hero-bg h1{
            font-size:clamp(2.6rem, 8vw, 4.7rem);
            font-weight:900;
            color:#fff;
            letter-spacing:0.05em;
            text-shadow:0 0 60px rgba(0,0,0,0.5);
        }
        .page-sub{
            margin-top:0.25rem;
            color:var(--green);
            font-size:1.2rem;
            letter-spacing:0.12em;
            text-transform:uppercase;
            font-weight:700;
        }

        .release-section{
            max-width:820px;
            margin:0 auto;
            text-align:center;
            padding:4rem 5% 2rem;
        }
        .release-section h2{
            text-align:center;
            font-size:clamp(2rem,5vw,3rem);
            margin-bottom:2rem;
            letter-spacing:0.05em;
        }
        .release-cover{
            width:100%;
            max-width:420px;
            aspect-ratio:1/1;
            margin:0 auto 1.5rem;
            border-radius:20px;
            border:2px solid rgba(57,255,20,0.3);
            background-size:cover;
            background-position:center;
            box-shadow:0 0 60px rgba(57,255,20,0.15);
            transition:all 0.3s ease;
        }
        .release-cover:hover{
            transform:scale(1.02);
            box-shadow:0 0 80px rgba(57,255,20,0.25);
            border-color:var(--green);
        }
        .release-title{
            font-size:2rem;
            color:#fff;
            margin-bottom:0.35rem;
        }
        .release-artist{
            color:rgba(255,255,255,0.64);
            margin-bottom:1.5rem;
        }
        .stream-btn{
            display:inline-block;
            padding:1rem 3.4rem;
            background:var(--green);
            color:#0A0A0A;
            text-decoration:none;
            font-weight:800;
            text-transform:uppercase;
            letter-spacing:0.14em;
            border-radius:50px;
            box-shadow:0 0 40px rgba(57,255,20,0.2);
            transition:all 0.3s ease;
        }
        .stream-btn:hover{
            background:var(--green-2);
            transform:translateY(-2px) scale(1.03);
            box-shadow:0 0 60px rgba(57,255,20,0.35);
        }

        .recent-releases{
            max-width:1300px;
            margin:0 auto;
            padding:2rem 5% 4rem;
        }
        .recent-releases h2{
            text-align:center;
            font-size:clamp(2rem, 5vw, 3rem);
            margin-bottom:2rem;
            letter-spacing:0.05em;
        }
        .release-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
            gap:2.2rem;
        }
        .release-item{
            background:rgba(15,15,15,0.9);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:20px;
            padding:1.5rem;
            text-align:center;
            transition:all 0.35s ease;
        }
        .release-item:hover{
            border-color:rgba(57,255,20,0.5);
            transform:translateY(-6px);
            box-shadow:0 0 40px rgba(57,255,20,0.06);
        }
        .release-item .cover-img{
            width:100%;
            aspect-ratio:1/1;
            border-radius:12px;
            background-size:cover;
            background-position:center;
            margin-bottom:1rem;
            border:1px solid rgba(255,255,255,0.08);
        }
        .release-item h3{
            color:#fff;
            font-size:1.2rem;
            margin-bottom:0.35rem;
            letter-spacing:0.06em;
        }
        .release-item .artist-name{
            color:rgba(255,255,255,0.55);
            font-size:0.8rem;
            margin-bottom:1rem;
        }
        .release-item .small-stream-btn{
            display:inline-block;
            padding:0.7rem 2rem;
            background:var(--green);
            color:#0A0A0A;
            text-decoration:none;
            border-radius:50px;
            text-transform:uppercase;
            letter-spacing:0.12em;
            font-weight:800;
            font-size:0.8rem;
            transition:all 0.3s ease;
        }
        .release-item .small-stream-btn:hover{
            background:var(--green-2);
            transform:scale(1.05);
            box-shadow:0 0 50px rgba(57,255,20,0.25);
        }

        .stream-cta{
            text-align:center;
            padding:2rem 5% 3rem;
        }
        .stream-cta a{
            display:inline-block;
            padding:1rem 3.4rem;
            background:var(--green);
            color:#0A0A0A;
            text-decoration:none;
            text-transform:uppercase;
            letter-spacing:0.12em;
            font-weight:800;
            border-radius:50px;
            box-shadow:0 0 40px rgba(57,255,20,0.2);
            transition:all 0.3s ease;
        }
        .stream-cta a:hover{
            background:var(--green-2);
            transform:translateY(-2px) scale(1.03);
            box-shadow:0 0 60px rgba(57,255,20,0.35);
        }

        footer{
            text-align:center;
            color:rgba(255,255,255,0.45);
            font-size:0.8rem;
            padding:2rem 5%;
            border-top:1px solid rgba(255,255,255,0.05);
        }
        footer a{ color:var(--green); text-decoration:none; }

        @media (max-width:768px){
            .logo{ margin-left:3.7rem; }
            .release-grid { grid-template-columns:1fr; }
        }
    </style>
</head>
<body>
    <nav>
        <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a href="index.html" class="logo" aria-label="Wreal X home">
            <span class="brand-mark">✦</span>
            <img src="https://files.catbox.moe/adx9wj.jpg" alt="Wreal X logo" class="brand-logo">
            <span class="brand-text">WREAL X</span>
        </a>
    </nav>

    <div class="side-nav" id="sideNav" aria-label="Main navigation menu">
        <a href="index.html">Home</a>
        <a href="music.html">Music</a>
        <a href="merch.html">Merch</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </div>

    <div class="nav-pointer" aria-hidden="true">👆</div>

    <div class="hero-bg">
        <h1>MUSIC</h1>
        <p class="page-sub">Cursed</p>
    </div>

    <section class="release-section">
        <h2>Stream Latest Release</h2>
        <div class="release-cover" style="background-image:url('https://files.catbox.moe/s11dsf.png');"></div>
        <h3 class="release-title">Nitro Veil</h3>

    <section class="recent-releases">
        <h2>Other Recent Releases</h2>
        <div class="release-grid">
            <div class="release-item">
                <div class="cover-img" style="background-image:url('https://files.catbox.moe/gq73y6.png');"></div>

            <div class="release-item">
                <div class="cover-img" style="background-image:url('https://files.catbox.moe/hasrqj.png');"></div>

                <p class="artist-name">Wreal X</p>

    <div class="stream-cta">
        <a href="https://ffm.to/nitro-veil" target="_blank">Stream Wreal X</a>

    <footer>© 2026 WREAL X · <a href="contact.html">Get in touch</a></footer>

    <script>
        (function(){
            const navToggle = document.querySelector('.nav-toggle');
            const sideNav = document.getElementById('sideNav');
            const sideNavLinks = document.querySelectorAll('.side-nav a');

            if (navToggle && sideNav) {
                navToggle.addEventListener('click', function(){
                    const isOpen = sideNav.classList.toggle('open');
                    navToggle.setAttribute('aria-expanded', String(isOpen));
                });

                sideNavLinks.forEach(function(link){
                    link.addEventListener('click', function(event){
                        const href = link.getAttribute('href');
                        sideNav.classList.remove('open');
                        navToggle.setAttribute('aria-expanded', 'false');

                        if (!href) return;
                        event.preventDefault();
                        setTimeout(function(){
                            window.location.href = href;
                        }, 180);
                    });
                });

                document.addEventListener('click', function(event){
                    if (!sideNav.classList.contains('open')) return;
                    if (!sideNav.contains(event.target) && !navToggle.contains(event.target)) {
                        sideNav.classList.remove('open');
                        navToggle.setAttribute('aria-expanded', 'false');
                    }
                });
            }
        })();
    </script>

        })();
    </script>
</body>
