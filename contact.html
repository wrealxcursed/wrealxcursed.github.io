<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Wreal X</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root{
            --bg:#0A0A0A;
            --text:#E7E7E7;
            --green:#39FF14;
            --green-2:#00FF41;
        }

        * { box-sizing:border-box; margin:0; padding:0; }
        html, body{
            background:var(--bg);
            color:var(--text);
            font-family:"Inter", sans-serif;
            min-height:100vh;
            overflow-x:hidden;
        }
        a, button, input, textarea { font-family:"Inter", sans-serif; }
        h1,h2,h3,.logo,.brand-text,.nav-toggle,.page-sub,.contact-info h2,.contact-form h3 { font-weight:800; }

        nav{
            display:flex;
            justify-content:flex-start;
            align-items:center;
            padding:1.1rem 1.2rem 0.8rem;
            width:100%;
            position:relative;
            z-index:30;
        }

        .logo{
            display:inline-flex;
            align-items:center;
            gap:0.5rem;
            margin-left:3.7rem;
            color:var(--green);
            text-decoration:none;
            text-transform:uppercase;
            letter-spacing:0.08em;
            text-shadow:0 0 35px rgba(57,255,20,0.2);
        }
        .brand-mark { font-size:1.1rem; line-height:1; }
        .brand-logo{
            width:auto; height:30px;
            border-radius:8px;
            object-fit:cover;
            display:inline-block;
            box-shadow:0 0 20px rgba(57,255,20,0.15);
        }
        .brand-text{
            display:inline-block;
            font-size:1.05rem;
            font-weight:800;
            letter-spacing:0.08em;
        }

        .nav-toggle{
            position:fixed;
            top:1.15rem;
            left:1.15rem;
            width:48px;
            height:48px;
            border:1px solid rgba(57,255,20,0.65);
            background:rgba(10,10,10,0.85);
            border-radius:12px;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            gap:6px;
            cursor:pointer;
            z-index:60;
            box-shadow:0 0 20px rgba(57,255,20,0.12);
        }
        .nav-toggle:hover{
            border-color:var(--green);
            box-shadow:0 0 30px rgba(57,255,20,0.2);
        }
        .nav-toggle span{
            display:block;
            width:22px;
            height:2px;
            background:var(--green);
            border-radius:2px;
            transition:transform 0.3s ease, opacity 0.3s ease;
        }
        .nav-toggle[aria-expanded="true"] span:nth-child(1){ transform:translateY(8px) rotate(45deg); }
        .nav-toggle[aria-expanded="true"] span:nth-child(2){ opacity:0; }
        .nav-toggle[aria-expanded="true"] span:nth-child(3){ transform:translateY(-8px) rotate(-45deg); }

        .side-nav{
            position:fixed;
            top:0; left:0;
            width:min(300px,80vw);
            height:100vh;
            background:rgba(10,10,10,0.97);
            border-right:1px solid rgba(57,255,20,0.3);
            box-shadow:0 0 40px rgba(0,0,0,0.35);
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:flex-start;
            gap:1rem;
            padding:5.5rem 1.25rem 2rem;
            transform:translateX(-105%);
            transition:transform 0.35s ease;
            z-index:55;
        }
        .side-nav.open { transform:translateX(0); }
        .side-nav a{
            width:100%;
            display:block;
            color:#fff;
            text-decoration:none;
            font-size:1.08rem;
            font-weight:700;
            letter-spacing:0.08em;
            text-transform:uppercase;
            padding:0.9rem 1rem;
            border-radius:10px;
            background:rgba(255,255,255,0.02);
            border:1px solid rgba(255,255,255,0.08);
            transition:all 0.3s ease;
        }
        .side-nav a:hover{
            color:var(--green);
            border-color:rgba(57,255,20,0.6);
            background:rgba(57,255,20,0.08);
            box-shadow:0 0 25px rgba(57,255,20,0.08);
        }

        .nav-pointer{
            position:fixed;
            top:3.8rem;
            left:4.5rem;
            font-size:2rem;
            filter:drop-shadow(0 0 12px rgba(57,255,20,0.6));
            pointer-events:none;
            z-index:70;
            animation:hand-bounce 1.1s ease-in-out infinite, hand-fade 0.6s ease 6s forwards;
        }
        @keyframes hand-bounce {
            0%,100% { transform:translateY(0) rotate(8deg); }
            50% { transform:translateY(-12px) rotate(0deg); }
        }
        @keyframes hand-fade {
            to { opacity:0; transform:translateY(-5px) scale(0.9); }
        }

        .hero-bg{
            min-height:38vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
            padding:2rem 5%;
            background:
                linear-gradient(to bottom, rgba(10,10,10,0.2) 0%, rgba(10,10,10,0.8) 50%, #0A0A0A 100%),
                url('https://iili.io/CD0qtob.png') center/cover no-repeat fixed;
            position:relative;
        }
        .hero-bg * { position:relative; z-index:1; }
        .hero-bg h1{
            font-size:clamp(2.6rem, 8vw, 4.7rem);
            font-weight:900;
            color:#fff;
            letter-spacing:0.05em;
            text-shadow:0 0 60px rgba(0,0,0,0.5);
        }
        .page-sub{
            margin-top:0.25rem;
            color:var(--green);
            font-size:1.2rem;
            letter-spacing:0.12em;
            text-transform:uppercase;
            font-weight:700;
        }

        .contact-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:4rem;
            max-width:1200px;
            margin:0 auto;
            padding:3rem 5%;
            min-height:60vh;
        }

        .contact-info h2{
            font-size:clamp(1.8rem, 3vw, 2.5rem);
            color:#fff;
            margin-bottom:1rem;
            letter-spacing:0.05em;
        }
        .contact-info p{
            color:rgba(255,255,255,0.75);
            line-height:1.8;
            margin-bottom:1.6rem;
            font-weight:300;
        }
        .contact-item{
            display:flex;
            align-items:center;
            gap:1rem;
            padding:0.9rem 1.1rem;
            background:rgba(15,15,15,0.9);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:12px;
            margin-bottom:1rem;
            transition:all 0.3s ease;
        }
        .contact-item:hover{
            border-color:rgba(57,255,20,0.5);
            box-shadow:0 0 20px rgba(57,255,20,0.05);
        }
        .contact-item i{
            color:var(--green);
            font-size:1.2rem;
            width:28px;
            text-align:center;
        }
        .contact-item a{
            color:#fff;
            text-decoration:none;
            transition:color 0.3s ease;
        }
        .contact-item a:hover{ color:var(--green); }

        .social-links{
            display:flex;
            gap:1.1rem;
            flex-wrap:wrap;
            margin-top:1.8rem;
        }
        .social-links a{
            color:#fff;
            opacity:0.72;
            font-size:1.8rem;
            transition:all 0.3s ease;
        }
        .social-links a:hover{
            color:var(--green);
            transform:translateY(-3px);
            opacity:1;
        }

        .contact-form{
            background:rgba(15,15,15,0.9);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:20px;
            padding:2.2rem;
        }
        .contact-form h3{
            font-size:1.4rem;
            margin-bottom:1.4rem;
            color:#fff;
        }
        .contact-form label{
            display:block;
            font-size:0.72rem;
            text-transform:uppercase;
            letter-spacing:0.12em;
            color:rgba(255,255,255,0.7);
            margin-bottom:0.35rem;
        }
        .contact-form input,
        .contact-form textarea{
            width:100%;
            padding:0.8rem 1rem;
            border:1px solid rgba(255,255,255,0.12);
            border-radius:10px;
            background:rgba(10,10,10,0.8);
            color:#fff;
            margin-bottom:1rem;
            transition:border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .contact-form input:focus,
        .contact-form textarea:focus{
            outline:none;
            border-color:var(--green);
            box-shadow:0 0 18px rgba(57,255,20,0.06);
        }
        .contact-form textarea{
            min-height:130px;
            resize:vertical;
        }
        .contact-form button{
            width:100%;
            padding:0.9rem 1rem;
            border:none;
            border-radius:50px;
            background:var(--green);
            color:#0A0A0A;
            font-weight:800;
            text-transform:uppercase;
            letter-spacing:0.12em;
            cursor:pointer;
            transition:all 0.3s ease;
            box-shadow:0 0 30px rgba(57,255,20,0.2);
        }
        .contact-form button:hover{
            background:var(--green-2);
            transform:translateY(-1px) scale(1.01);
            box-shadow:0 0 60px rgba(57,255,20,0.32);
        }

        .stream-cta{
            text-align:center;
            padding:0.6rem 5% 2rem;
        }
        .stream-cta a{
            display:inline-block;
            padding:1rem 3.4rem;
            background:var(--green);
            color:#0A0A0A;
            text-decoration:none;
            text-transform:uppercase;
            letter-spacing:0.12em;
            font-weight:800;
            border-radius:50px;
            box-shadow:0 0 40px rgba(57,255,20,0.2);
            transition:all 0.3s ease;
        }
        .stream-cta a:hover{
            background:var(--green-2);
            transform:translateY(-2px) scale(1.03);
            box-shadow:0 0 60px rgba(57,255,20,0.35);
        }

        footer{
            text-align:center;
            color:rgba(255,255,255,0.45);
            font-size:0.8rem;
            padding:2rem 5%;
            border-top:1px solid rgba(255,255,255,0.05);
        }
        footer a{ color:var(--green); text-decoration:none; }

        @media (max-width:900px){
            .contact-grid{ grid-template-columns:1fr; }
        }
        @media (max-width:768px){
            .logo{ margin-left:3.7rem; }
        }
    </style>
</head>

    <script>
        (function(){
            const navToggle = document.querySelector('.nav-toggle');
            const sideNav = document.getElementById('sideNav');
            const sideNavLinks = document.querySelectorAll('.side-nav a');

            if (navToggle && sideNav) {
                navToggle.addEventListener('click', function(){
                    const isOpen = sideNav.classList.toggle('open');
                    navToggle.setAttribute('aria-expanded', String(isOpen));
                });

                sideNavLinks.forEach(function(link){
                    link.addEventListener('click', function(event){
                        const href = link.getAttribute('href');
                        sideNav.classList.remove('open');
                        navToggle.setAttribute('aria-expanded', 'false');

                        if (!href) return;
                        event.preventDefault();
                        setTimeout(function(){
                            window.location.href = href;
                        }, 180);
                    });
                });

                document.addEventListener('click', function(event){
                    if (!sideNav.classList.contains('open')) return;
                    if (!sideNav.contains(event.target) && !navToggle.contains(event.target)) {
                        sideNav.classList.remove('open');
                        navToggle.setAttribute('aria-expanded', 'false');
                    }
                });
            }
        })();
    </script>
