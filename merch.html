    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: #0A0A0A; color: #E0E0E0; font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; overflow-y: auto; }
        body { position: relative; }
        h1, h2, h3, .logo, .brand-text, .nav-toggle, .page-sub, .merch-item h3 { font-family: 'Inter', sans-serif; font-weight: 800; }
        nav { display: flex; justify-content: flex-start; align-items: center; padding: 1.2rem 1.2rem 0.8rem; position: relative; z-index: 30; width: 100%; }
        .logo { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 1.1rem; font-weight: 800; color: #39FF14; text-decoration: none; letter-spacing: 0.06em; text-transform: uppercase; text-shadow: 0 0 40px rgba(57,255,20,0.3), 0 0 80px rgba(57,255,20,0.1); margin-left: 3.9rem; }
        .brand-mark { font-size: 1.1rem; line-height: 1; color: #39FF14; }
        .brand-logo { width: auto; height: 30px; border-radius: 8px; object-fit: cover; display: inline-block; box-shadow: 0 0 20px rgba(57,255,20,0.15); }
        .brand-text { display: inline-block; font-size: 1.1rem; font-weight: 800; letter-spacing: 0.08em; }
        .logo:hover { text-shadow: 0 0 60px rgba(57,255,20,0.5), 0 0 120px rgba(57,255,20,0.2); }
        .nav-toggle { position: fixed; top: 1.15rem; left: 1.15rem; width: 48px; height: 48px; border: 1px solid rgba(57,255,20,0.6); border-radius: 12px; background: rgba(10,10,10,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; cursor: pointer; z-index: 60; box-shadow: 0 0 20px rgba(57,255,20,0.12); }
        .nav-toggle:hover { border-color: #39FF14; box-shadow: 0 0 30px rgba(57,255,20,0.2); }
        .nav-toggle span { display: block; width: 22px; height: 2px; background: #39FF14; border-radius: 2px; transition: transform 0.3s ease, opacity 0.3s ease; }
        .nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
        .nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
        .side-nav { position: fixed; top: 0; left: 0; width: min(300px, 80vw); height: 100vh; background: rgba(10,10,10,0.96); border-right: 1px solid rgba(57,255,20,0.3); box-shadow: 0 0 40px rgba(0,0,0,0.35); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 1rem; padding: 5.5rem 1.25rem 2rem; transform: translateX(-105%); transition: transform 0.35s ease; z-index: 55; }
        .side-nav.open { transform: translateX(0); }
        .side-nav a { width: 100%; display: block; color: #FFFFFF; text-decoration: none; font-size: 1.15rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.9rem 1rem; border-radius: 10px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); transition: all 0.3s ease; }
        .side-nav a:hover { color: #39FF14; border-color: rgba(57,255,20,0.6); background: rgba(57,255,20,0.08); box-shadow: 0 0 25px rgba(57,255,20,0.08); }
        .nav-pointer { position: fixed; top: 3.8rem; left: 4.5rem; font-size: 2rem; line-height: 1; filter: drop-shadow(0 0 10px rgba(57,255,20,0.6)); animation: hand-bounce 1.1s ease-in-out infinite, hand-fade 0.6s ease 6s forwards; z-index: 70; pointer-events: none; }
        @keyframes hand-bounce { 0%, 100% { transform: translateY(0) rotate(8deg); } 50% { transform: translateY(-12px) rotate(0deg); } }
        @keyframes hand-fade { to { opacity: 0; transform: translateY(-5px) scale(0.9); } }
        .hero-bg { min-height: 40vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 2rem 5%; background: linear-gradient(to bottom, rgba(10,10,10,0.2) 0%, rgba(10,10,10,0.8) 50%, #0A0A0A 100%), url('https://iili.io/CD0qtob.png'); background-size: cover; background-position: center; position: relative; background-attachment: fixed; }
        .hero-bg * { position: relative; z-index: 1; }
        .hero-bg h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 900; color: #FFFFFF; text-shadow: 0 0 60px rgba(0,0,0,0.5); }
        .page-sub { text-align: center; color: #39FF14; font-size: 1.2rem; letter-spacing: 0.1em; margin-top: 0.2rem; font-weight: 700; }
        .merch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 2.5rem; padding: 3rem 5%; max-width: 1300px; margin: 0 auto; }
        .merch-item { background: rgba(15,15,15,0.9); border-radius: 20px; padding: 1.8rem; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); transition: all 0.4s; text-align: center; }
        .merch-item:hover { border-color: #39FF14; box-shadow: 0 0 40px rgba(57,255,20,0.06); transform: translateY(-6px); }
        .merch-item .merch-image { width: 100%; aspect-ratio: 1/1; border-radius: 12px; background-size: cover; background-position: center; margin-bottom: 1rem; border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s; }
        .merch-item .merch-image:hover { border-color: #39FF14; transform: scale(1.02); }
        .merch-item h3 { font-size: 1.3rem; color: #FFFFFF; margin-bottom: 0.3rem; letter-spacing: 0.05em; }
        .merch-item .tag { display: inline-block; background: #39FF14; color: #0A0A0A; font-size: 0.65rem; font-weight: 700; padding: 0.2rem 1rem; border-radius: 20px; text-align: center; margin: 0 auto 1rem; display: table; letter-spacing: 0.1em; text-transform: uppercase; }
        .merch-item .buy-btn { display: inline-block; padding: 0.8rem 3rem; background: #39FF14; color: #0A0A0A; font-weight: 700; border-radius: 50px; text-decoration: none; transition: all 0.3s; font-family: 'Inter', sans-serif; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 0.1em; border: none; cursor: pointer; margin-top: 0.5rem; box-shadow: 0 0 30px rgba(57,255,20,0.2); }
        .merch-item .buy-btn:hover { background: #00FF41; transform: scale(1.05); box-shadow: 0 0 60px rgba(57,255,20,0.4); }
        .stream-cta { text-align: center; padding: 1rem 5% 2rem; }
        .stream-cta a { display: inline-block; padding: 1rem 3.5rem; background: #39FF14; color: #0A0A0A; font-weight: 700; border-radius: 50px; text-decoration: none; transition: all 0.3s; font-family: 'Inter', sans-serif; text-transform: uppercase; font-size: 1.1rem; letter-spacing: 0.15em; box-shadow: 0 0 40px rgba(57,255,20,0.2); }
        .stream-cta a:hover { background: #00FF41; transform: scale(1.05); box-shadow: 0 0 60px rgba(57,255,20,0.4); }
        footer { text-align: center; padding: 2rem 5%; color: #FFFFFF; font-size: 0.8rem; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 1rem; opacity: 0.4; }
        footer a { color: #39FF14; text-decoration: none; }
        @media (max-width: 768px) { nav { padding-top: 0.9rem; } .logo { margin-left: 3.7rem; } .merch-grid { grid-template-columns: 1fr; } }
    </style>

    <script>
      const navToggle = document.querySelector('.nav-toggle');
      const sideNav = document.getElementById('sideNav');
      const sideNavLinks = document.querySelectorAll('.side-nav a');
      if (navToggle && sideNav) {
        navToggle.addEventListener('click', function(){ const isOpen = sideNav.classList.toggle('open'); navToggle.setAttribute('aria-expanded', String(isOpen)); });
        sideNavLinks.forEach(function(link){ link.addEventListener('click', function(event){ const href = link.getAttribute('href'); sideNav.classList.remove('open'); navToggle.setAttribute('aria-expanded', 'false'); if (!href) return; event.preventDefault(); setTimeout(function(){ window.location.href = href; }, 180); }); });
        document.addEventListener('click', function(event){ if (!sideNav.classList.contains('open')) return; if (!sideNav.contains(event.target) && !navToggle.contains(event.target)) { sideNav.classList.remove('open'); navToggle.setAttribute('aria-expanded', 'false'); } });
      }
    </script>
